services:
  db:
    image: postgres:16-alpine
    container_name: buscador_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buscador_personas}
      POSTGRES_USER: ${POSTGRES_USER:-buscador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buscador_backend
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en el archivo .env}
      ALLOW_OPEN_ACCESS: "false"
      ENABLE_C4: ${ENABLE_C4:-false}
      # Nginx es el único punto de entrada; confía en sus cabeceras de proxy
      # para que el rate limiting y la auditoría usen la IP real del cliente.
      FORWARDED_ALLOW_IPS: "*"
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    image: nginx:alpine
    container_name: buscador_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
