version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: buscador_db
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: buscador_personas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d buscador_personas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: buscador_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://usuario:contraseña@db:5432/buscador_personas
      # Configura RUC_API_KEY y otras variables en un archivo .env
    env_file:
      - ./backend/.env.example # Usa el example por defecto para desarrollo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app # Mount source for hot reload in dev
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: buscador_frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
