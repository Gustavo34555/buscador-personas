server {
    listen 80;
    server_name _;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeceras de seguridad también para el frontend estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Frontend estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash/versión en la URL: cacheables un año.
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    # El shell y el service worker no deben quedar cacheados con versiones viejas.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }
    location = /sw.js {
        root /usr/share/nginx/html;
        expires -1;
    }

    # Proxy hacia el Backend FastAPI
    location ~ ^/(persona|buscar|scraping|api|docs|openapi.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescribir (no concatenar) para que un cliente no pueda falsificar
        # su IP y evadir el rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
